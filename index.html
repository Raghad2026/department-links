<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام ربط صلاحيات الأقسام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1A1A1A;
    --navy-light:#2E2E2E;
    --sidebar-bg:#F1ECDF;
    --gold:#B8944F;
    --gold-light:#F3EAD3;
    --orange:#C97D2E;
    --bg:#FAF8F4;
    --card:#FFFFFF;
    --line:#E8E3D8;
    --text:#1E1E1E;
    --text-muted:#6B6A63;
    --danger:#B23B3B;
    --ok:#2F6E4E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Tajawal', Arial, sans-serif;
  }
  .app{display:flex; min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:260px; background:var(--sidebar-bg); color:var(--text); flex-shrink:0;
    display:flex; flex-direction:column; border-left:1px solid var(--line);
  }
  .sidebar-header{
    padding:26px 20px 18px; border-bottom:1px solid rgba(0,0,0,0.08); text-align:center;
  }
  .brand-icon{ width:34px; height:auto; margin-bottom:12px; }
  .sidebar-header h1{font-size:15px; font-weight:700; margin:0 0 4px; color:var(--text);}
  .sidebar-header p{font-size:11px; color:var(--text-muted); margin:0; letter-spacing:.3px;}
  .dept-list{list-style:none; margin:0; padding:10px;}
  .dept-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 14px; margin-bottom:3px; border-radius:8px; cursor:pointer;
    font-size:14px; color:var(--text);
    border-right:3px solid transparent;
    transition:background .15s;
  }
  .dept-item:hover{background:rgba(0,0,0,0.05);}
  .dept-item.active{
    background:rgba(0,0,0,0.06);
    border-right-color:var(--gold);
    color:var(--text); font-weight:700;
  }
  .dept-item.disabled{
    color:rgba(0,0,0,0.32); cursor:not-allowed;
  }
  .dept-item.disabled:hover{background:transparent;}
  .badge-soon{
    font-size:10px; background:rgba(0,0,0,0.06); color:var(--text-muted);
    padding:2px 7px; border-radius:20px;
  }
  .my-tasks-box{
    padding:14px 16px; border-bottom:1px solid rgba(0,0,0,0.08);
  }
  .my-tasks-box label{
    display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:7px; font-weight:700;
  }
  .my-tasks-box select{
    width:100%; padding:9px 10px; border-radius:8px; border:1px solid rgba(0,0,0,0.15);
    background:#fff; color:var(--text); font-family:inherit; font-size:13px;
  }
  .my-tasks-box select option{ color:#111; }
  .sidebar-divider{
    padding:12px 20px 6px; font-size:11px; color:var(--text-muted); font-weight:700;
  }
  .role-type-badge{
    display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; margin-left:6px; margin-bottom:6px;
  }
  .role-type-badge.prepare{background:#EAF1FB; color:#144A8C;}
  .role-type-badge.review{background:#F3E6C8; color:#7a5d16;}
  .role-type-badge.approve{background:#EAF3DE; color:#3B6D11;}
  .role-type-badge.execute{background:#FAECE7; color:#993C1D;}
  .role-type-badge.notify{background:#FBEAF0; color:#993556;}
  .card-dept-tag{
    font-size:11px; color:var(--text-muted); font-weight:700; margin-bottom:6px;
  }
  .incoming-panel{
    background:#F4F8F0; border:1px solid #DCE9CE; border-radius:12px; padding:16px 18px; margin-bottom:22px;
  }
  .incoming-panel > .incoming-title{
    font-size:14px; font-weight:900; color:#3B6D11; margin-bottom:12px; display:flex; align-items:center; gap:6px;
  }
  .incoming-card{
    background:#fff; border:1px solid #E4E0D6; border-radius:10px; padding:12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .incoming-card:hover{ border-color:#B8C99E; }
  .incoming-source{ font-size:11px; font-weight:700; color:#3B6D11; margin-bottom:5px; }
  .incoming-item-title{ font-size:13.5px; font-weight:700; line-height:1.6; margin-bottom:4px; }
  .incoming-roles{ font-size:11.5px; color:var(--text-muted); }
  .not-loaded-note{
    font-size:12.5px; color:var(--text-muted); background:#FAF9F6; border:1px dashed var(--line);
    padding:12px 14px; border-radius:10px; margin-bottom:16px;
  }
  .tabbar{
    display:flex; gap:6px; margin-bottom:20px; border-bottom:1px solid var(--line);
  }
  .tab-btn{
    padding:10px 18px; font-size:13.5px; font-weight:700; color:var(--text-muted);
    cursor:pointer; border-bottom:3px solid transparent; background:none; font-family:inherit;
  }
  .tab-btn.active{ color:var(--navy); border-bottom-color:var(--gold); }
  .tab-btn .count{
    font-size:11px; background:#F1EFE8; color:var(--text-muted); padding:1px 7px; border-radius:20px; margin-right:5px;
  }
  .tab-btn.active .count{ background:var(--gold-light); color:#7a5d16; }
  .sidebar-footer{
    padding:14px 20px; font-size:11px;
    color:var(--text-muted); border-top:1px solid rgba(0,0,0,0.08);
  }
  .values-box{
    margin-top:auto; padding:18px 18px 16px; border-top:1px solid rgba(0,0,0,0.08);
  }
  .values-card{
    direction:ltr; text-align:left; border:1px solid rgba(0,0,0,0.18); border-radius:2px;
    padding:14px 14px 12px 10px; position:relative;
  }
  .values-card .our-label{
    writing-mode:vertical-rl; transform:rotate(180deg); font-size:9px; letter-spacing:2px;
    color:var(--orange); font-weight:700; position:absolute; top:14px; left:8px;
  }
  .values-card .values-script{
    font-family:'Dancing Script', cursive; font-size:26px; font-weight:700; color:var(--text);
    margin:0 0 8px 16px; line-height:1;
  }
  .values-card .values-words{
    margin-right:0; margin-left:16px; display:flex; flex-direction:column; gap:2px;
  }
  .values-card .values-words span{
    font-size:11px; letter-spacing:.5px; font-weight:600; color:var(--text);
  }
  .values-card .values-words span.v-accent{ color:var(--orange); }
  .values-card .u-mark{ width:16px; height:auto; margin-top:8px; margin-left:16px; opacity:.9; }

  /* Main */
  .main{flex:1; padding:28px 34px; max-width:900px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:16px;}
  .topbar h2{font-size:22px; margin:0; font-weight:900; color:var(--navy);}
  .search-box{
    flex:1; max-width:320px; position:relative;
  }
  .search-box input{
    width:100%; padding:9px 14px; border-radius:8px; border:1px solid var(--line);
    font-family:inherit; font-size:13px; background:#fff;
  }
  .breadcrumb{
    display:flex; align-items:center; gap:8px; margin-bottom:18px; flex-wrap:wrap;
  }
  .crumb{
    font-size:12px; background:var(--gold-light); color:#7a5d16;
    padding:5px 12px; border-radius:20px; cursor:pointer; font-weight:700;
  }
  .crumb:hover{background:#eddcac;}

  .section-title{
    font-size:15px; font-weight:700; color:var(--navy); margin:26px 0 12px;
    padding-bottom:6px; border-bottom:2px solid var(--gold-light);
  }
  .subheader{
    font-size:13px; font-weight:700; color:var(--text-muted); margin:14px 0 8px;
  }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; margin-bottom:12px; scroll-margin-top:20px;
  }
  .card.flash{ animation:flashHighlight 1.8s ease; }
  @keyframes flashHighlight{
    0%{box-shadow:0 0 0 3px var(--gold); background:var(--gold-light);}
    100%{box-shadow:0 0 0 0 transparent; background:var(--card);}
  }
  .card-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .card-num{
    flex-shrink:0; width:26px; height:26px; border-radius:50%;
    background:var(--navy); color:#fff; font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .card-title{font-size:14.5px; font-weight:700; line-height:1.6; white-space:pre-line;}

  .roles{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:8px; margin:10px 0; padding:10px; background:#FAF9F6; border-radius:8px;
  }
  .role{font-size:12px;}
  .role .lbl{color:var(--text-muted); display:block; margin-bottom:2px; font-weight:700;}
  .role .val{color:var(--text);}
  .role .val.empty{color:#c3c1b8;}

  .notes{font-size:12.5px; color:var(--text-muted); background:#FAF9F6; padding:9px 11px; border-radius:8px; margin-top:8px; white-space:pre-line; line-height:1.6;}

  .links-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .link-badge{
    font-size:12px; padding:6px 12px; border-radius:20px; cursor:pointer;
    background:#EAF1FB; color:#144A8C; font-weight:700; display:inline-flex; align-items:center; gap:5px;
    border:1px solid #D3E3F8;
  }
  .link-badge:hover{background:#D3E3F8;}
  .link-badge.disabled{
    background:#F1EFE8; color:#9A988E; cursor:not-allowed; border-color:#E4E0D6;
  }
  .link-badge .arrow{font-size:11px;}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-muted);
  }
  .empty-state .big{font-size:15px; font-weight:700; margin-bottom:6px; color:var(--navy);}

  .no-results{padding:30px; text-align:center; color:var(--text-muted); font-size:13px;}

  @media (max-width:720px){
    .app{flex-direction:column;}
    .sidebar{width:100%;}
    .main{padding:18px;}
  }
</style>
</head>

"31"}], "quality": [{"source_dept": "operations", "source_id": "30", "title": "التنسيق ب:\n 1- متابعة تصحيح المخالفات البلدية و الاشتراطات الصحية\n2- زيارات تفتيش الفروع\n3- تطبيق أنظمة ضمان الجودة في الفروع والمستودع\n  و (ص 6)\n4- تصنيف وترتيب المنتجات الغذائية ومسلتزمات المطعم بالتوزيع الصحيح", "prepare": "Operations Manager", "review": null, "approve": null, "execute": "Quality Manager", "notify": "Management", "notes": null, "target_item_id": "1"}]}}</script>
<script>
const PAYLOAD = JSON.parse(document.getElementById('app-data').textContent);
const DIRECTORY = PAYLOAD.directory;
const DEPTS = PAYLOAD.departments;
const ROLES = PAYLOAD.roles;
const REVERSE_LINKS = PAYLOAD.reverse_links || {};

let currentDept = DIRECTORY.find(d => d.loaded).key;
let history = [];
let searchTerm = '';
let myTasksMode = false;
let selectedRole = '';
let contentTab = 'own';

const FIELD_LABELS = {prepare:'إعداد', review:'مراجعة', approve:'اعتماد', execute:'تنفيذ', notify:'إبلاغ'};

function populateRoleSelect(){
  const sel = document.getElementById('roleSelect');
  ROLES.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', (e) => {
    selectedRole = e.target.value;
    if (selectedRole){
      myTasksMode = true;
      history = [];
      renderSidebar();
      renderBreadcrumb();
      renderTabbar();
      renderMyTasks();
    } else {
      myTasksMode = false;
      renderSidebar();
      renderBreadcrumb();
      renderTabbar();
      renderContent(null);
    }
  });
}

function roleMatches(fieldVal, role){
  if (!fieldVal) return false;
  return fieldVal.split(/[\/،]/).map(s => s.trim()).includes(role);
}

function renderMyTasks(){
  document.getElementById('deptTitle').textContent = 'مهامي — ' + selectedRole;
  const container = document.getElementById('content');
  container.innerHTML = '';
  let found = 0;

  DIRECTORY.filter(d => d.loaded).forEach(d => {
    const dept = DEPTS[d.key];
    const matchedItems = [];
    dept.sections.forEach(section => {
      section.items.forEach(it => {
        if (it.is_subheader) return;
        const types = Object.keys(FIELD_LABELS).filter(f => roleMatches(it[f], selectedRole));
        if (types.length) matchedItems.push({item: it, types});
      });
    });
    if (!matchedItems.length) return;
    found += matchedItems.length;

    const secTitle = document.createElement('div');
    secTitle.className = 'section-title';
    secTitle.textContent = deptLabel(d.key) + ' (' + matchedItems.length + ')';
    container.appendChild(secTitle);

    matchedItems.forEach(({item: it, types}) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = 'item-' + d.key + '-' + it.id;

      const badges = types.map(t => `<span class="role-type-badge ${t}">${FIELD_LABELS[t]}</span>`).join('');

      let linksHtml = '';
      if (it.links && it.links.length){
        linksHtml = '<div class="links-row">' + it.links.map(l => {
          const targetDept = DIRECTORY.find(x => x.key === l.dept_key);
          const enabled = targetDept && targetDept.loaded;
          const label = (l.dept_key ? deptLabel(l.dept_key) : l.dept_raw) + (l.item_id ? ' — بند ' + l.item_id : '');
          if (enabled){
            return `<span class="link-badge" data-dept="${l.dept_key}" data-item="${l.item_id||''}"><span class="arrow">↩</span> مرتبط بـ ${label}</span>`;
          } else {
            return `<span class="link-badge disabled" title="القسم لم يُرفع بعد">مرتبط بـ ${label}</span>`;
          }
        }).join('') + '</div>';
      }

      card.innerHTML = `
        <div style="margin-bottom:8px;">${badges}</div>
        <div class="card-head">
          <div class="card-num">${it.id}</div>
          <div class="card-title">${it.title}</div>
        </div>
        <div class="roles">
          ${roleRow('إعداد', it.prepare)}
          ${roleRow('مراجعة', it.review)}
          ${roleRow('اعتماد', it.approve)}
          ${roleRow('تنفيذ', it.execute)}
          ${roleRow('إبلاغ', it.notify)}
        </div>
        <div class="notes"><b>الشروط والملاحظات:</b> ${it.notes || 'لا توجد ملاحظات أو شروط مسجّلة لهذا البند'}</div>
        ${linksHtml}
      `;
      container.appendChild(card);
    });
  });

  if (!found){
    container.innerHTML = `<div class="empty-state"><div class="big">ما فيه مهام مرتبطة بهذا المسمى بعد</div><div>إمّا المسمى ما له مهام بالأقسام المرفوعة، أو الأقسام اللي فيها مهامه لسا ما انرفعت.</div></div>`;
  }

  container.querySelectorAll('.link-badge:not(.disabled)').forEach(b => {
    b.onclick = () => {
      const targetDept = b.getAttribute('data-dept');
      const targetItem = b.getAttribute('data-item');
      myTasksMode = false;
      document.getElementById('roleSelect').value = '';
      goToDept(targetDept, targetItem || null, true);
    };
  });
}

function deptLabel(key){
  const d = DIRECTORY.find(x => x.key === key);
  return d ? d.ar : key;
}

function renderSidebar(){
  const list = document.getElementById('deptList');
  list.innerHTML = '';
  DIRECTORY.forEach(d => {
    const incoming = (REVERSE_LINKS[d.key] || []).length;
    const accessible = d.loaded || incoming > 0;
    const li = document.createElement('li');
    li.className = 'dept-item' + (!myTasksMode && d.key === currentDept ? ' active' : '') + (!accessible ? ' disabled' : '');
    let badge = '';
    if (!d.loaded && incoming > 0){
      badge = `<span class="badge-soon">${incoming} رابط وارد</span>`;
    } else if (!d.loaded){
      badge = '<span class="badge-soon">لم يُرفع بعد</span>';
    }
    li.innerHTML = `<span>${d.ar}</span>` + badge;
    if (accessible){
      li.onclick = () => {
        myTasksMode = false;
        document.getElementById('roleSelect').value = '';
        goToDept(d.key, null, true);
      };
    }
    list.appendChild(li);
  });
}

function goToDept(key, focusUid, resetHistory){
  const d = DIRECTORY.find(x => x.key === key);
  const incoming = (REVERSE_LINKS[key] || []).length;
  if (!d || (!d.loaded && incoming === 0)) return;
  myTasksMode = false;
  if (!resetHistory && currentDept && currentDept !== key){
    history.push({dept: currentDept});
  }
  if (resetHistory) history = [];
  currentDept = key;
  searchTerm = '';
  contentTab = 'own';
  document.getElementById('searchInput').value = '';
  renderSidebar();
  renderBreadcrumb();
  renderTabbar();
  renderContent(focusUid);
}

function renderBreadcrumb(){
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = '';
  if (history.length === 0) return;
  history.forEach((h) => {
    const c = document.createElement('span');
    c.className = 'crumb';
    c.textContent = '← ' + deptLabel(h.dept);
    c.onclick = () => {
      const idx = history.indexOf(h);
      history = history.slice(0, idx);
      currentDept = h.dept;
      contentTab = 'own';
      renderSidebar();
      renderBreadcrumb();
      renderTabbar();
      renderContent(null);
    };
    bc.appendChild(c);
  });
}

function itemMatches(item, term){
  if (!term) return true;
  const hay = (item.title + ' ' + (item.notes||'') + ' ' + (item.prepare||'') + ' ' + (item.execute||'')).toLowerCase();
  return hay.includes(term.toLowerCase());
}

function roleRow(label, val){
  return `<div class="role"><span class="lbl">${label}</span><span class="val ${val ? '' : 'empty'}">${val || '—'}</span></div>`;
}

function renderTabbar(){
  const bar = document.getElementById('tabbar');
  if (myTasksMode){
    bar.innerHTML = '';
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  const incomingCount = (REVERSE_LINKS[currentDept] || []).length;
  const ownCount = DEPTS[currentDept] ? DEPTS[currentDept].sections.reduce((sum, s) => sum + s.items.filter(i => !i.is_subheader).length, 0) : 0;
  bar.innerHTML = `
    <button class="tab-btn ${contentTab === 'own' ? 'active' : ''}" id="tabOwn"><span class="count">${ownCount}</span>كل صلاحيات القسم</button>
    <button class="tab-btn ${contentTab === 'incoming' ? 'active' : ''}" id="tabIncoming"><span class="count">${incomingCount}</span>مرتبط بهذا القسم من أقسام أخرى</button>
  `;
  document.getElementById('tabOwn').onclick = () => { contentTab = 'own'; renderTabbar(); renderContent(null); };
  document.getElementById('tabIncoming').onclick = () => { contentTab = 'incoming'; renderTabbar(); renderContent(null); };
}

function renderIncomingOnly(){
  const container = document.getElementById('content');
  container.innerHTML = '';
  const incoming = REVERSE_LINKS[currentDept] || [];
  if (!incoming.length){
    container.innerHTML = `<div class="empty-state"><div class="big">ما فيه صلاحيات من أقسام ثانية مرتبطة بهذا القسم لحد الآن</div></div>`;
    return;
  }
  const panel = document.createElement('div');
  panel.className = 'incoming-panel';
  panel.innerHTML = `<div class="incoming-title">🔗 صلاحيات من أقسام أخرى مرتبطة بهذا القسم (${incoming.length})</div>`;
  incoming.forEach(inc => {
    const card = document.createElement('div');
    card.className = 'incoming-card';
    const rolesLine = [
      inc.execute ? 'تنفيذ: ' + inc.execute : '',
      inc.notify ? 'إبلاغ: ' + inc.notify : ''
    ].filter(Boolean).join(' · ');
    card.innerHTML = `
      <div class="incoming-source">من قسم ${deptLabel(inc.source_dept)} — بند ${inc.source_id}${inc.target_item_id ? ' (يشير إلى بند ' + inc.target_item_id + ' بقسمك)' : ''}</div>
      <div class="incoming-item-title">${inc.title}</div>
      ${rolesLine ? `<div class="incoming-roles">${rolesLine}</div>` : ''}
    `;
    card.onclick = () => goToDept(inc.source_dept, inc.source_id, false);
    panel.appendChild(card);
  });
  container.appendChild(panel);
}

function renderContent(focusUid){
  const dept = DEPTS[currentDept];
  document.getElementById('deptTitle').textContent = deptLabel(currentDept);
  const container = document.getElementById('content');
  container.innerHTML = '';

  if (contentTab === 'incoming'){
    renderIncomingOnly();
    return;
  }

  if (!dept){
    const note = document.createElement('div');
    note.className = 'not-loaded-note';
    note.textContent = 'بيانات صلاحيات هذا القسم نفسه لسا ما انرفعت. تقدر تشوف الصلاحيات المرتبطة فيه من الأقسام الثانية بالتبويب الثاني فوق.';
    container.appendChild(note);
    return;
  }

  let anyVisible = false;

  dept.sections.forEach(section => {
    const visibleItems = section.items.filter(it => it.is_subheader || itemMatches(it, searchTerm));
    const hasRealItem = visibleItems.some(it => !it.is_subheader);
    if (!hasRealItem) return;
    anyVisible = true;

    const secTitle = document.createElement('div');
    secTitle.className = 'section-title';
    secTitle.textContent = section.title;
    container.appendChild(secTitle);

    visibleItems.forEach(it => {
      if (it.is_subheader){
        const sh = document.createElement('div');
        sh.className = 'subheader';
        sh.textContent = it.title;
        container.appendChild(sh);
        return;
      }
      const card = document.createElement('div');
      card.className = 'card';
      card.id = 'item-' + currentDept + '-' + it.id;

      let linksHtml = '';
      if (it.links && it.links.length){
        linksHtml = '<div class="links-row">' + it.links.map(l => {
          const targetDept = DIRECTORY.find(x => x.key === l.dept_key);
          const enabled = targetDept && targetDept.loaded;
          const label = (l.dept_key ? deptLabel(l.dept_key) : l.dept_raw) + (l.item_id ? ' — بند ' + l.item_id : '');
          if (enabled){
            return `<span class="link-badge" data-dept="${l.dept_key}" data-item="${l.item_id||''}"><span class="arrow">↩</span> مرتبط بـ ${label}</span>`;
          } else {
            return `<span class="link-badge disabled" title="القسم لم يُرفع بعد">مرتبط بـ ${label}</span>`;
          }
        }).join('') + '</div>';
      }

      card.innerHTML = `
        <div class="card-head">
          <div class="card-num">${it.id}</div>
          <div class="card-title">${it.title}</div>
        </div>
        <div class="roles">
          ${roleRow('إعداد', it.prepare)}
          ${roleRow('مراجعة', it.review)}
          ${roleRow('اعتماد', it.approve)}
          ${roleRow('تنفيذ', it.execute)}
          ${roleRow('إبلاغ', it.notify)}
        </div>
        <div class="notes"><b>الشروط والملاحظات:</b> ${it.notes || 'لا توجد ملاحظات أو شروط مسجّلة لهذا البند'}</div>
        ${linksHtml}
      `;
      container.appendChild(card);
    });
  });

  if (!anyVisible){
    const noRes = document.createElement('div');
    noRes.className = 'no-results';
    noRes.textContent = 'لا توجد نتائج مطابقة للبحث.';
    container.appendChild(noRes);
  }

  container.querySelectorAll('.link-badge:not(.disabled)').forEach(b => {
    b.onclick = () => {
      const targetDept = b.getAttribute('data-dept');
      const targetItem = b.getAttribute('data-item');
      goToDept(targetDept, targetItem || null, false);
    };
  });

  if (focusUid){
    setTimeout(() => {
      const el = document.getElementById('item-' + currentDept + '-' + focusUid);
      if (el){
        el.scrollIntoView({behavior:'smooth', block:'center'});
        el.classList.add('flash');
        setTimeout(() => el.classList.remove('flash'), 1800);
      }
    }, 60);
  }
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchTerm = e.target.value;
  renderContent(null);
});

renderSidebar();
renderBreadcrumb();
populateRoleSelect();
renderTabbar();
renderContent(null);
</script>
</body>
</html>
