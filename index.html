/* ---- link graph ---- */

 var tgt=BY[l.d];

});});});

function pairs(a,b){

  if(e.a===a&&e.b===b){mn=e.an;tn=e.bn;}else if(e.b===a&&e.a===b){mn=e.bn;tn=e.an;}else return;
  var k=mn==null?'x':mn;if(!g[k]){g[k]={m:mn,t:[]};order.push(k);}
  if(g[k].t.indexOf(tn)<0)g[k].t.push(tn);
 });

var DIG='[0-9٠-٩]';
var WD='(?:ال)?(?:اثنين|إثنين|ثلاثاء|اربعاء|أربعاء|خميس|جمعة|سبت|احد|أحد)';
var QW='(?:(?:ال)?(?:اسبوعين|أسبوعين|اسبوع|أسبوع|يومين|شهرين|شهر)|يوم|'+DIG+'+\\s*(?:ايام|أيام|يوم|اسابيع|أسابيع|اسبوع|أسبوع|ساعات|ساعة|شهور|شهر))';
var RANGE='(?:\\s*(?:الى|إلى|-|–)\\s*'+DIG+'+(?:\\s*(?:ايام|أيام|اسابيع|أسابيع))?)?(?:\\s+على\\s+(?:الأقل|الاقل))?';
var TB_RULES=[
 ['every',new RegExp('كل\\s+(?:يوم\\s+)?'+WD,'g'),'🔁'],
 ['every',new RegExp('كل\\s+(?:يوم\\s+)?'+DIG+'{1,2}\\s+من\\s+(?:ال)?شهر','g'),'🔁'],
 ['every',/كل\s+(?:اسبوع|أسبوع|شهر|يوم)(?![ء-ي])/g,'🔁'],
 ['before',new RegExp('قبل\\s+(?:(?:افتتاح|انتهاء|بدء|بدا|بداية)\\s+\\S+\\s+)?(?:ب\\s*)?'+QW+'(?:\\s+'+DIG+'+)?'+'(?:\\s+من\\s+(?:ال)?شهر)?'+RANGE,'g'),'⏳'],
 ['before',new RegExp('بعد\\s+(?:انتهاء\\s+)?(?:ب\\s*)?'+DIG+'+\\s*(?:ايام|أيام|يوم)','g'),'⏳'],
 ['within',new RegExp('خلال\\s+(?:'+QW+')(?:\\s*[-–]\\s*(?:اسبوع|أسبوع|'+DIG+'+\\s*\\S+))?','g'),'⏱'],
 ['within',/(?:مدة\s+\S+\s+)?فور(?:ا|اً|اَ)(?![ء-ي])/g,'⏱'],
 ['within',new RegExp('مدة\\s+\\S+(?:\\s+\\S+)?\\s+'+DIG+'+\\s*(?:يوم|ايام|أيام|شهر|اسبوع|أسبوع)','g'),'⏱'],
 ['when',new RegExp('(?:آخر|اخر)\\s+يوم\\s+من\\s+(?:ال)?شهر','g'),'📅'],
 ['when',new RegExp('(?:بتاريخ|تاريخ|يوم|في)\\s+'+DIG+'{1,2}\\s*(?:من\\s*(?:كل\\s*)?)?(?:ال)?شهر','g'),'📅'],
 ['when',new RegExp('يوم\\s+'+WD,'g'),'📅'],
 ['when',new RegExp('الساعة\\s+'+DIG+'+(?::'+DIG+'+)?\\s*(?:ص|م|صباحا|مساء|صباحاً|مساءً)?','g'),'📅'],
 ['every',/(?<![ء-ي])(?:يومي|أسبوعي|اسبوعي|شهري|ربع\s*سنوي|سنوي)[اًَ]*(?![ء-ي])/g,'🔁']
];
function clean(s){return s.replace(/\s+/g,' ').replace(/[\s:،\-–]+$/,'').trim();}
function timeBadges(text){
 if(!text)return [];
 var src=String(text).replace(/\n/g,' '),out=[],seenT={};
 TB_RULES.forEach(function(r){
  src=src.replace(r[1],function(m){
   var tx=clean(m);
   if(!seenT[tx]){seenT[tx]=1;out.push({c:r[0],i:r[2],t:tx});}
   return ' @@ ';
  });
 });
 return out.slice(0,6);
}

function noteHtml(s){
 var lines=String(s).split('\n').map(function(l){return l.trim();}).filter(Boolean);
 var num=lines.filter(function(l){return /^[0-9٠-٩]+\s*[-–.)]/.test(l);}).length;
 if(num<2)return '<div class="nt">'+esc(lines.join('\n'))+'</div>';
 var h='<div class="nt">',open=false;
 lines.forEach(function(l){
  var m=l.match(/^([0-9٠-٩]+)\s*[-–.)]\s*(.*)$/);
  if(m){if(!open){h+='<ol class="steps">';open=true;}h+='<li><span>'+esc(m[2])+'</span></li>';}
  else if(open){h=h.replace(/<\/span><\/li>$/,' '+esc(l)+'</span></li>');}
  else h+='<div>'+esc(l)+'</div>';
 });
 return h+(open?'</ol>':'')+'</div>';
}

 DEPTS.forEach(function(d){var its=d.items.filter(function(i){return strictRole(i,r);});if(its.length){groups.push([d,its]);tot+=its.length;}});
 groups.sort(function(a,b){return (b[0]===home)-(a[0]===home);});
 h+='<p class="sub">'+(home?'من قسم <a class="chip" href="'+href(home.k,'all')+'">'+esc(home.ar)+'</a> · ':(HOME[r]==='management'?'من الإدارة · ':''))+tot+' مهمة في '+groups.length+' أقسام</p>';
 if(!groups.length)h+='<div class="empty">ما فيه مهام لهذا المسمى.</div>';
 groups.forEach(function(g){
  h+='<div class="dh"><a href="'+href(g[0].k,'all')+'">'+esc(g[0].ar)+'</a><i>'+g[1].length+'</i></div>';
  g[1].forEach(function(it){h+=card(g[0],it);});
 });
 $('view').innerHTML=h+'</div>';renderNav(home?home.k:null);renderWho();window.scrollTo(0,0);
}
function tabPol(d){
 var cnt={};d.items.forEach(function(i){cnt[i.s]=(cnt[i.s]||0)+1;});
 var reps={};d.items.forEach(function(i){if(i.rep)reps[i.s]=(reps[i.s]||0)+1;});
 if(!d.secs.length)return '<div class="empty">ما فيه سياسات مسجلة لهذا القسم.</div>';
 var h='<p class="sub">سياسات القسم، اضغط «المهام» لتفتح مهام السياسة.</p><div class="pol">';
 d.secs.forEach(function(s,i){
  var n=cnt[i]||0,r=reps[i]||0;
  h+='<div class="pc"><span class="pn">'+esc(s.l)+'</span><span class="pt">'+esc(s.n||s.l)+'</span><div class="pm"><b>'+(n===1?'فيها مهمة واحدة':'فيها '+n+' مهام')+'</b>'+(r?'<b class="pr">'+(r===1?'تقرير واحد':r+' تقارير')+'</b>':'')+'<a class="go" href="'+href(d.k,'p'+i)+'">المهام ←</a></div></div>';
 });
 return h+'</div>';
}
function tabForms(d){
 return '<div class="empty"><b>النماذج المعتمدة لقسم '+esc(d.ar)+'</b><br>قيد التجهيز، وبتظهر هنا قريباً.</div>';
}
var ADM={supply:[{t:'مصفوفة حدود الاعتماد المالي',cols:['من','إلى','جهة الاعتماد'],rows:[
 ['0 ريال','20,000 ريال','Procurement Manager'],
 ['أكثر من 20,000 ريال','50,000 ريال','Supply Chain Manager'],
 ['أكثر من 50,000 ريال','100,000 ريال','Head of Operations'],
 ['أكثر من 100,000 ريال','مفتوح','Chief Executive Officer (CEO)']]}]};
function tabAdm(d){
 var L=ADM[d.k];
 if(!L)return '<div class="empty"><b>الصلاحيات الإدارية لقسم '+esc(d.ar)+'</b><br>جداول حدود الاعتماد، قيد التجهيز وبتظهر هنا قريباً.</div>';
 return L.map(function(x){
  return '<div class="adm"><h3>'+esc(x.t)+'</h3><div class="tw"><table><thead><tr>'+x.cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>'+x.rows.map(function(r){return '<tr>'+r.map(function(c,i){return '<td'+(i===2?' dir="ltr" class="ap"':'')+'>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div></div>';
 }).join('');
}
function dept(dk,tab,n,sec){
 var d=BY[dk];if(!d){go('');return;}
 var tabs=tabsFor(dk).map(function(t){return t[0];});
 if(tabs.indexOf(tab)<0)tab=tabs[0];
 var h=pageHead(d,tab);
 if(tab==='pol')h+=tabPol(d);else if(tab==='all')h+=tabAll(d,n);else if(tab==='coord')h+=tabCoord(d);else if(tab==='rel')h+=tabRel(d);else if(tab==='forms')h+=tabForms(d);else if(tab==='adm')h+=tabAdm(d);else if(/^p\d+$/.test(tab))h+=tabAll(d,n,parseInt(tab.slice(1),10));else h+=tabRep(d);
 $('view').innerHTML=h+'</div>';
 renderNav(dk);renderWho();
 var om=$('om');if(om)om.onchange=function(){onlyMine=om.checked;route();};
 if(n!=null){var el=$('it-'+dk+'-'+n);if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');}}
 else if(sec!=null){var se=$('sec-'+dk+'-'+sec);if(se){se.scrollIntoView({block:'start'});window.scrollBy(0,-70);}}
 else window.scrollTo(0,0);
}
function go(p){if(location.hash==='#/'+p)route();else location.hash='#/'+p;}
function route(){
 document.body.classList.remove('open');
 var p=location.hash.replace(/^#\/?/,'').split('/');
 if(p[0]==='management'){mgmtView();return;}
 if(p[0]==='reports'){reportsView(p[1]||null);return;}
 if(p[0]==='r'&&p[1]){roleView(decodeURIComponent(p[1]));return;}
 if(!p[0]){ if(me){go(me.d);return;} welcome(0);return; }
 if(!me&&!browse&&false){welcome(0);return;}
 var sx=p[2]&&/^s\d+$/.test(p[2])?parseInt(p[2].slice(1),10):null;
 dept(p[0],p[1]||null,(p[2]!=null&&sx==null)?parseInt(p[2],10):null,sx);
}
window.addEventListener('hashchange',route);
$('burger').onclick=function(){document.body.classList.toggle('open');};
$('scrim').onclick=function(){document.body.classList.remove('open');};
/* ---- search ---- */
var q=$('q'),sr=$('sres');
q.addEventListener('input',function(){
 var v=q.value.trim().toLowerCase();if(v.length<2&&!/^\d+$/.test(v)){sr.style.display='none';return;}
 var out=[];
 DEPTS.forEach(function(d){d.items.forEach(function(i){if(out.length>=15)return;if(i.t.toLowerCase().indexOf(v)>=0||String(i.n)===v)out.push([d,i]);});});
 sr.innerHTML=out.length?out.map(function(o){return '<a href="'+href(o[0].k,'all',o[1].n)+'"><small>'+esc(o[0].ar)+' · #'+o[1].n+'</small><br>'+esc(o[1].t.split('\n')[0])+'</a>';}).join(''):'<a>ما لقينا نتائج</a>';
 sr.style.display='block';
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){sr.style.display='none';q.blur();}});
document.addEventListener('click',function(e){if(!e.target.closest('.search'))sr.style.display='none';else if(e.target.closest('.sres a[href]')){sr.style.display='none';q.value='';}});
route();
})();
</script>
